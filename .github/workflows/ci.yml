name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen
      - name: Install isolated quality environment
        run: bash scripts/setup_quality_env.sh
      - name: Documentation checks
        run: bash scripts/dev_check.sh --docs

  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tools
        run: bash scripts/setup_quality_env.sh
      - name: Unit tests
        run: bash scripts/dev_check.sh --test
      - name: Lint
        run: bash scripts/dev_check.sh --lint
      - name: Type check
        run: bash scripts/dev_check.sh --types
      - name: Build distributions
        run: bash scripts/dev_check.sh --build
