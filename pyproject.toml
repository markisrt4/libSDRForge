[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "libsdrforge"
version = "0.1.0"
description = "Reusable, hardware-agnostic SDR receiving and signal processing toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "libSDRForge contributors"}]
keywords = ["sdr", "radio", "dsp", "fm", "rds"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
rtl = []
dev = ["pytest>=8"]
quality = ["ruff>=0.6", "mypy>=1.11", "scipy-stubs>=1.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdrforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sdrforge"]
