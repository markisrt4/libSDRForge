[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "libsdrforge"
version = "0.1.0"
description = "Reusable, hardware-agnostic SDR receiving and signal processing toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "libSDRForge contributors"}]
keywords = ["sdr", "radio", "dsp", "fm", "rds"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
sdrforge-server = "sdrforge.live_transport_server:main"

[project.optional-dependencies]
rtl = []
weather = ["vosk>=0.3.45"]
zmq = ["pyzmq>=26"]
audio = ["sounddevice>=0.4.6"]
dev = ["pytest>=8"]
quality = ["ruff==0.17.6", "mypy>=1.11", "scipy-stubs>=1.11", "build>=1.2"]

quality-termux = ["mypy>=1.11", "scipy-stubs>=1.11", "build>=1.2"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/examples", "/component_test",
    "/scripts", "/requirements", "/README.md", "/LICENSE*", "/NOTICE*",
    "/CONTRIBUTING.md", "/AGENTS.md", "/pyproject.toml", "/Doxyfile",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.venv*", "**/.env*", "**/*.log"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdrforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sdrforge"]

[[tool.mypy.overrides]]
module = ["sounddevice", "vosk", "zmq"]
ignore_missing_imports = true
