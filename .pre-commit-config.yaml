repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check src tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: ruff-format-check
        name: Ruff format check
        entry: python -m ruff format --check src tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]
